<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Interactions</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="content"><header class="topbar"><div><p class="eyebrow">Engagement</p><h1>Interactions</h1></div><a class="btn primary" th:href="@{/interactions/new}">+ Log Interaction</a></header><div class="table-card"><table><thead><tr><th>Type</th><th>Client</th><th>Notes</th><th>Date</th><th>Follow-up</th><th>Actions</th></tr></thead><tbody><tr th:each="i:${interactions}"><td th:text="${i.type}"></td><td th:text="${i.client != null ? i.client.name : '-'}"></td><td th:text="${i.notes}"></td><td th:text="${i.interactionDate ?: '-'}"></td><td th:text="${i.nextFollowUp ?: '-'}"></td><td><form th:action="@{/interactions/delete/{id}(id=${i.id})}" method="post"><button class="link-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(interactions)}"><td colspan="6" class="empty">No interactions yet.</td></tr></tbody></table></div></main></body></html>
