<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Interaction</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="content"><header class="topbar"><div><p class="eyebrow">Engagement</p><h1>Log Interaction</h1></div></header><form class="form-card" th:action="@{/interactions/save}" th:object="${interaction}" method="post"><div class="form-grid"><div><label>Type *</label><select th:field="*{type}" required><option value="CALL">Call</option><option value="MEETING">Meeting</option><option value="EMAIL">Email</option><option value="DEMO">Demo</option><option value="NOTE">Note</option></select></div><div><label>Client</label><select name="clientId"><option value="">-- None --</option><option th:each="c:${clients}" th:value="${c.id}" th:text="${c.name}"></option></select></div><div><label>Interaction Date</label><input type="datetime-local" th:field="*{interactionDate}"></div><div><label>Next Follow-up</label><input type="datetime-local" th:field="*{nextFollowUp}"></div><div class="full-field"><label>Notes *</label><textarea th:field="*{notes}" rows="5" required></textarea></div></div><div class="form-actions"><a class="btn" th:href="@{/interactions}">Cancel</a><button class="btn primary">Save Interaction</button></div></form></main></body></html>
