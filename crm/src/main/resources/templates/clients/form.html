<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Client</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="content"><header class="topbar"><div><p class="eyebrow">CRM</p><h1 th:text="${client.id == null ? 'Add Client' : 'Edit Client'}"></h1></div></header><form class="form-card" th:action="@{/clients/save}" th:object="${client}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div><label>Name *</label><input th:field="*{name}" required><small th:errors="*{name}"></small></div><div><label>Company</label><input th:field="*{company}"></div><div><label>Email</label><input type="email" th:field="*{email}"></div><div><label>Phone</label><input th:field="*{phone}"></div><div><label>Industry</label><input th:field="*{industry}"></div><div><label>Status</label><select th:field="*{status}"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select></div><div class="full-field"><label>Address</label><input th:field="*{address}"></div></div><div class="form-actions"><a class="btn" th:href="@{/clients}">Cancel</a><button class="btn primary">Save Client</button></div></form></main></body></html>
