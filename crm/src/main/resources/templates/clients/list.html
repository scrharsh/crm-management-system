<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Clients</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="content"><header class="topbar"><div><p class="eyebrow">CRM</p><h1>Clients</h1></div><a class="btn primary" th:href="@{/clients/new}">+ Add Client</a></header><div class="table-card"><table><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="c:${clients}"><td th:text="${c.name}"></td><td th:text="${c.company ?: '-'}"></td><td th:text="${c.email ?: '-'}"></td><td th:text="${c.phone ?: '-'}"></td><td><span class="badge" th:text="${c.status}"></span></td><td class="actions"><a th:href="@{/clients/edit/{id}(id=${c.id})}">Edit</a><form th:action="@{/clients/delete/{id}(id=${c.id})}" method="post"><button class="link-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(clients)}"><td colspan="6" class="empty">No clients yet.</td></tr></tbody></table></div></main></body></html>
