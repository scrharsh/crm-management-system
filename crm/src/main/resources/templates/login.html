<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Login</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><div class="auth-card"><div class="brand dark">CRM<span>.</span></div><h1>Welcome back</h1><p class="muted">Sign in to your CRM workspace.</p><div class="alert error" th:if="${param.error}">Invalid username or password.</div><div class="alert success" th:if="${param.logout}">You have been logged out.</div><form th:action="@{/login}" method="post"><label>Username</label><input name="username" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><button class="btn primary full" type="submit">Sign in</button></form><div class="demo-box"><b>Demo accounts</b><br>admin / admin123<br>manager / manager123<br>executive / executive123</div></div></body></html>
