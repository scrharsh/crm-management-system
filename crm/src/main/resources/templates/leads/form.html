<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Lead</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="content"><header class="topbar"><div><p class="eyebrow">Pipeline</p><h1 th:text="${lead.id == null ? 'Add Lead' : 'Edit Lead'}"></h1></div></header><form class="form-card" th:action="@{/leads/save}" th:object="${lead}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div><label>Name *</label><input th:field="*{name}" required><small th:errors="*{name}"></small></div><div><label>Company</label><input th:field="*{company}"></div><div><label>Email</label><input type="email" th:field="*{email}"></div><div><label>Phone</label><input th:field="*{phone}"></div><div><label>Status</label><select th:field="*{status}"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select></div><div><label>Source</label><select th:field="*{source}"><option th:each="s:${sources}" th:value="${s}" th:text="${s}"></option></select></div></div><div class="form-actions"><a class="btn" th:href="@{/leads}">Cancel</a><button class="btn primary">Save Lead</button></div></form></main></body></html>
