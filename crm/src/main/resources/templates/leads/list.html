<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Leads</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="content"><header class="topbar"><div><p class="eyebrow">Pipeline</p><h1>Leads</h1></div><a class="btn primary" th:href="@{/leads/new}">+ Add Lead</a></header><div class="table-card"><table><thead><tr><th>Name</th><th>Company</th><th>Contact</th><th>Source</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="l:${leads}"><td th:text="${l.name}"></td><td th:text="${l.company ?: '-'}"></td><td th:text="${l.email ?: l.phone ?: '-'}"></td><td th:text="${l.source}"></td><td><span class="badge" th:text="${l.status}"></span></td><td class="actions"><a th:href="@{/leads/edit/{id}(id=${l.id})}">Edit</a><form th:action="@{/leads/delete/{id}(id=${l.id})}" method="post"><button class="link-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(leads)}"><td colspan="6" class="empty">No leads yet.</td></tr></tbody></table></div></main></body></html>
