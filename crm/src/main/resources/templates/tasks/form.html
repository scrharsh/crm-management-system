<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Task</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="content"><header class="topbar"><div><p class="eyebrow">Execution</p><h1 th:text="${task.id == null ? 'Add Task' : 'Edit Task'}"></h1></div></header><form class="form-card" th:action="@{/tasks/save}" th:object="${task}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="full-field"><label>Title *</label><input th:field="*{title}" required></div><div class="full-field"><label>Description</label><textarea th:field="*{description}" rows="4"></textarea></div><div><label>Priority</label><select th:field="*{priority}"><option th:each="p:${priorities}" th:value="${p}" th:text="${p}"></option></select></div><div><label>Status</label><select th:field="*{status}"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select></div><div><label>Due Date</label><input type="date" th:field="*{dueDate}"></div><div><label>Client</label><select name="clientId"><option value="">-- None --</option><option th:each="c:${clients}" th:value="${c.id}" th:text="${c.name}" th:selected="${task.client != null and task.client.id == c.id}"></option></select></div></div><div class="form-actions"><a class="btn" th:href="@{/tasks}">Cancel</a><button class="btn primary">Save Task</button></div></form></main></body></html>
