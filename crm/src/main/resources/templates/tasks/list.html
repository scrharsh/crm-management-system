<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Tasks</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="content"><header class="topbar"><div><p class="eyebrow">Execution</p><h1>Tasks</h1></div><a class="btn primary" th:href="@{/tasks/new}">+ Add Task</a></header><div class="table-card"><table><thead><tr><th>Title</th><th>Client</th><th>Priority</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="t:${tasks}"><td th:text="${t.title}"></td><td th:text="${t.client != null ? t.client.name : '-'}"></td><td><span class="badge" th:text="${t.priority}"></span></td><td th:text="${t.dueDate ?: '-'}"></td><td th:text="${t.status}"></td><td class="actions"><a th:href="@{/tasks/edit/{id}(id=${t.id})}">Edit</a><form th:action="@{/tasks/delete/{id}(id=${t.id})}" method="post"><button class="link-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(tasks)}"><td colspan="6" class="empty">No tasks yet.</td></tr></tbody></table></div></main></body></html>
